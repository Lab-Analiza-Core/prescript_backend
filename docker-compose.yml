services:
  prescript_backend:
    container_name: prescript_backend
    build: .
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: Prescript.settings
      TZ: America/Tegucigalpa
      PRESCRIPT_HOST: host.docker.internal
      INTERACTIVE_CORE_HOST: host.docker.internal
      REDIS_URL: redis://redis:6379/1
      # Dentro del contenedor "localhost" es el propio contenedor; las URLs del
      # .env se sobrescriben para llegar al Postgres del host.
      PRESCRIPT_DATABASE_URL: postgres://postgres:1234@host.docker.internal:5433/prescript_db
      INTERACTIVE_CORE_DATABASE_URL: postgres://postgres:1234@host.docker.internal:5433/interactivecore_db
      # Acceso local por http://localhost:8003 (sin TLS): sin esto DEBUG=False
      # redirige todo a HTTPS y las cookies seguras no se envian.
      SECURE_SSL_REDIRECT: "false"
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      SECURE_HSTS_SECONDS: "0"
      TRUST_PROXY_SSL_HEADER: "false"
      DATABASE_URL: ""
      DOCTOR_SYNC_QUEUE_ENABLED: "false"
      DOCTOR_SYNC_ENABLED: "false"
      DOCTOR_SYNC_CRON_ENABLE: "false"
      DOCTOR_SYNC_TARGET_DATABASE_URL: ""
    ports:
      - "8003:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  staticfiles:
  media:
